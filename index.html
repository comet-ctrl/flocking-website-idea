<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080b0e">
  <title>Red Arrow — Flock</title>
  <meta name="description" content="Move a glowing red arrow through a living flock of silver birds.">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b0e}
    canvas{display:block;width:100%;height:100%;touch-action:none;cursor:none}
    canvas:focus-visible{outline:1px solid #ee7a8d;outline-offset:-1px}
  </style>
</head>
<body>
  <canvas id="field" tabindex="0" aria-label="Interactive silver bird flock. Move your mouse or drag a finger to guide the red arrow. Hold to increase avoidance. Press Space to pause or resume. Animation starts paused when reduced motion is preferred."></canvas>
  <script src="flock.js"></script>
  <script src="flock-runner.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b11"><title>Red Arrow — Flock</title><meta name="description" content="Move a glowing red arrow through a living field of silver particles."><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b11;color:#edf0f3;font-family:Arial,Helvetica,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:none}header{position:absolute;top:36px;left:40px;pointer-events:none}h1{font-size:13px;letter-spacing:.24em;font-weight:500;margin:0 0 12px}.dot{display:inline-block;width:6px;height:6px;background:#ff526d;border-radius:50%;margin-right:11px;box-shadow:0 0 12px #ff526d}header p{font-size:12px;color:#76808d;margin:0;letter-spacing:.04em}.controls{position:absolute;bottom:28px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:end;gap:20px;pointer-events:none}.hint{font-size:11px;line-height:1.9;color:#838b98;letter-spacing:.04em}.buttons{display:flex;flex-wrap:wrap;gap:8px;pointer-events:auto}.speed{display:flex;align-items:center;gap:7px;font-size:11px;color:#bec5cf}.speed select{background:#111720;color:#edf0f3;border:1px solid #ffffff30;border-radius:7px;padding:10px 6px}button{border:1px solid #ffffff20;background:#111720b0;color:#bec5cf;padding:11px 15px;border-radius:7px;font-size:11px;letter-spacing:.03em;backdrop-filter:blur(12px);cursor:pointer}button:hover,button:focus-visible{background:#26303c;color:#fff;outline:1px solid #ff6077}button[aria-pressed=true]{color:#ff738a;border-color:#ff607766}@media(max-width:600px){header{left:24px;top:28px}.controls{left:24px;right:24px;bottom:22px;align-items:start;flex-direction:column}.hint{font-size:10px}button{padding:10px 12px}}
</style></head><body>
<canvas id="field" aria-label="Interactive silver particle field. Move your pointer to guide the red arrow. Hold to scatter particles."></canvas>
<header><h1><span class="dot"></span>RED ARROW</h1><p>One intruder. A thousand reactions.</p></header>
<div class="controls"><div class="hint" id="hint">MOVE TO DISTURB &nbsp; · &nbsp; HOLD TO SCATTER<br>SPACE TO PAUSE &nbsp; · &nbsp; H TO HIDE CONTROLS</div><div class="buttons"><label class="speed">Speed <select id="speed" aria-label="Simulation speed"><option value="1">1×</option><option value="1.5">1.5×</option><option value="1.8" selected>1.8×</option><option value="2.2">2.2×</option></select></label><button id="mode" aria-pressed="false">Demo intruder</button><button id="pause" aria-pressed="false">Pause</button><button id="reset">Reset</button><button id="full">Fullscreen</button></div></div>
<script src="flock.js"></script><script src="app.js"></script></body></html>
